
name: CloudFlow CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check index.html exists
        run: test -f index.html

      - name: Validate HTML structure
        run: |
          grep -qi '<html' index.html
          grep -qi '<head' index.html
          grep -qi '<body' index.html
          echo "HTML structure validation passed."

      - name: Validate website title
        run: |
          grep -qi '<title>CloudFlow' index.html
          echo "Website title validation passed."

  deploy:
    name: Deploy to AWS S3
    runs-on: ubuntu-latest
    needs: validate

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Diagnose OIDC subject (temporary)
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );
            core.info(`OIDC issuer: ${payload.iss}`);
            core.info(`OIDC audience: ${payload.aud}`);
            core.info(`OIDC subject: ${payload.sub}`);

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Deploy website to S3
        run: |
          aws s3 cp index.html \
            "s3://${{ vars.AWS_S3_BUCKET }}/index.html" \
            --content-type "text/html"
