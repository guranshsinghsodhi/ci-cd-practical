
name: CloudFlow CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check website file exists
        run: test -f index.html

      - name: Check required HTML elements
        run: |
          grep -qi '<!DOCTYPE html>' index.html
          grep -qi '<html' index.html
          grep -qi '<head>' index.html
          grep -qi '<body>' index.html
          grep -qi '</html>' index.html

      - name: Check page title
        run: grep -qi '<title>CloudFlow' index.html

  deploy:
    name: Deploy website to Amazon S3
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Deploy website files to S3
        run: aws s3 cp index.html "s3://${{ vars.AWS_S3_BUCKET }}/index.html" --content-type "text/html"
